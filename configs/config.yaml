# Central configuration — every tunable lives here (AGENTS.md §6). No hardcoded magic values in code.
# Secrets (DB_USER, DB_PASSWORD, DB_HOST, DB_PORT, DB_NAME) live in .env — never in this file.

# --- Paths (relative to project root) ---
paths:
  raw_data: data/raw
  processed_data: data/processed
  simulated_data: data/simulated
  results: results
  reports: reports
  notebooks: notebooks

# --- Results layout ---
results:
  figures: figures     # results/figures
  tables: tables       # results/tables
  uplift: uplift       # results/uplift (Day 14)
  target_segments: target_segments  # results/target_segments (Day 15)
  roi: roi                          # results/roi (Day 16)
  counterfactuals: counterfactuals  # results/counterfactuals (Day 17)

# --- Reproducibility ---
seed: 42

# --- Causal analysis window ---
outcome_window_days: 14

# --- IPW (Day 10) tunables ---
ipw:
  weight_cap: 10.0        # truncate stabilized weights above this multiple (Cole & Hernan)
  bootstrap_reps: 500     # resamples for bootstrap CI (fixed seed from `seed`)
  alpha: 0.05             # CI level

# --- ATE/ATT synthesis (Day 12) tunables ---
synthesis:
  dowhy_method: backdoor.linear_regression   # DoWhy estimator for the cross-check
  convergence_tol_conversion_abs: 0.02       # max range across estimators (pp, absolute)
  convergence_tol_revenue_rel: 0.10          # max range across estimators (relative to |mean|)

# --- CATE meta-learners (Day 13) tunables ---
cate:
  base_max_depth: 3            # HistGradientBoosting tree depth for all learners
  base_max_iter: 100           # boosting iterations
  bootstrap_reps: 300          # resamples for the mean-CATE CI (fixed seed from `seed`)
  alpha: 0.05                  # CI level
  agreement_tol_conversion_abs: 0.01  # hook: |mean CATE - Day-12 ATE| (pp, absolute)
  agreement_tol_revenue_rel: 0.10     # hook: |mean CATE - Day-12 ATE| (revenue, relative)
  agreement_max_decile_rel: 0.25      # hook: max pairwise decile-curve |d| / |mean CATE| (effect size; stable for near-flat signals)

# --- Uplift modeling (Day 14) tunables ---
uplift:
  qini_grid_points: 10               # points per strategy/cell in the curves CSV + figure
  qini_true_lift_min_gt_pct: 0.5     # hook: mean Uplift-strategy TRUE lift (cumulative |true effect|
                                     #        gain, 0 = chance) over channels with a real embedded
                                     #        effect (email/search/social) >= this (%). Oracle
                                     #        ceiling on this DGP is ~27%, so 0.5% is a modest bar
  qini_true_lift_display_max_pct: 0.5  # hook: display TRUE lift <= this (%) — embedded effect is
                                     #        0.00, so there is nothing to rank; any score's
                                     #        true-lift must be ~0
  scatter_sample: 5000               # points per channel in the segment mosaic (display downsampling)
  segment_min_share: 0.05            # hook: every marketing segment >= this share of the channel

# --- CATE segmentation (Day 15) tunables ---
segments:
  n_bands: 5                        # quintile bands of the Day-13 ensemble CATE per channel x outcome
  gt_positive_min_oracle: 0.005     # hook: email/search (conversion): every band's oracle mean > this
                                    #       (counterfactual effect positive throughout)
  social_negative_max_oracle: -0.005  # hook: social (conversion): every band's oracle mean < this
                                    #       (counterfactual effect negative throughout)
  display_oracle_zero_tol: 1e-6     # hook: display (conversion): |band oracle mean| <= this
                                    #       (counterfactual effect exactly 0)
  est_all_positive_min: 0.05        # hook: every channel (conversion): every band's ESTIMATED CATE > this —
                                    #       the shared-sim_u-bias demonstration (observed data cannot
                                    #       recover the true sign structure; min observed 0.099)
  rank_gap_min: 0.0001              # hook: email/search: top-band oracle mean > bottom-band by this
                                    #       (a real but tiny rank gradient; social is flat/inverted by
                                    #       design — reported, not gated)

# --- Incremental ROI (Day 16; ADR-006: costs are ASSUMPTIONS — Olist has no spend data) ---
# Per-treated-customer cost in R$ over the 14-day outcome window, order-of-magnitude
# Brazilian e-commerce. ROI = (incremental revenue per treated - cost) / cost (blueprint §9).
roi:
  cost_per_treated: { email: 0.10, search: 1.50, display: 0.20, social: 0.80 }
  causal_estimator: dr              # headline causal estimate from the Day-12 master table
  observational_estimator: naive    # Day-8 diff-in-means (attribution-style)
  complete_rows_expected: 12        # hook: 4 channels x 3 methods
  causal_roi_positive_min: 0.0      # hook: min causal ROI > this for EVERY channel (the sim_u-bias
                                    #       demonstration: even causal ROI is positive everywhere)
  ctf_email_search_min_roi: 0.0     # hook: counterfactual ROI positive for email/search
  ctf_social_display_max_roi: 0.0   # hook: counterfactual ROI negative for social/display
  overstatement_min_gt: 1.0         # hook: causal ROI / counterfactual ROI > this for email/search
                                    #       (documented overstatement multiple)

# --- Counterfactual budget scenarios (Day 17; blueprint §9) ---
# Fixed total budget = as-run campaign spend (cost x treated, computed from the
# Day-16 config costs). Scenarios re-split the SAME budget. Every result is a
# model-based counterfactual estimate (simulation-only) per AGENTS.md §2.
counterfactuals:
  scenarios: [as_run, naive, causal, ctf_guided]  # as_run = as executed; naive = attribution-weighted;
                                              # causal = Day-12 DR causal ROI; ctf_guided = DGP-informed
                                              # (positive counterfactual-ROI channels only)
  cohort_cap: 0                   # cap implied treated at the cohort size (0 -> 94,983) when a
                                  # scenario's spend/cost exceeds the observed treated range
  as_run_net_tol: 0.01            # hook: as_run per-channel nets match the Day-16 counterfactual
                                  #       cohort nets within R$ (cross-day consistency check)
  realloc_beat_min_margin: 0.0    # hook: every reallocation scenario total net > as_run total net
                                  #       (the observed spend scatter is worse than any re-split)
  optimum_min_margin: 0.0         # hook: max scenario total net <= the budget-constrained linear
                                  #       optimum (greedy email-then-search, positive channels only)

# --- Simulated marketing layer (design: docs/data-feasibility.md §4) ---
# Day 3 ships a clearly-labeled PREVIEW of the layer so channel descriptive
# stats can be shown; the full campaign-date structure lands in Week 2.
# All variables produced here are prefixed sim_ and NEVER presented as
# observed Olist facts (AGENTS.md §2).
simulation:
  preview:
    # latent intent U ~ N(0, u_std) drives assignment AND outcome => residual
    # confounding is built in on purpose; later sensitivity analysis uses it.
    u_std: 1.0
    u_assignment_coef: 0.8
    u_outcome_coef: 1.0
    # baseline 14-day purchase intent (log-odds) for an "average" customer
    base_outcome_intercept: -1.6
    channels:
      email:
        assignment_intercept: -1.0
        assignment_coefs: { recency_days: -0.4, total_revenue: 0.5, order_count: 0.3, review_score_avg: 0.1 }
        effect_log_odds: 0.12
        narrative: "reactivation works"
      search:
        assignment_intercept: -0.8
        assignment_coefs: { tenure_days: -0.3, order_count: 0.4, total_revenue: 0.3 }
        effect_log_odds: 0.15
        narrative: "captures demand"
      display:
        assignment_intercept: -0.6
        assignment_coefs: { recency_days: -0.2, total_revenue: 0.2 }
        effect_log_odds: 0.0
        narrative: "apparent effect is pure confounding"
      social:
        assignment_intercept: -1.2
        assignment_coefs: { order_count: 0.5, total_revenue: 0.3, tenure_days: 0.2 }
        effect_log_odds: -0.08
        narrative: "sleeping dogs"
    # simulated 14-day revenue when converted: exp(N(mu, sigma))
    revenue_log_mean: 4.6
    revenue_log_sigma: 0.8

# --- Olist raw-data registry (source: documented Kaggle row counts / mirror verification) ---
olist:
  base_url: https://raw.githubusercontent.com/Ganesh7699/Brazilian-E-Commerce-OList/main
  geo_zip_name: "Geolocation Dataset.zip"
  files:
    olist_orders_dataset.csv: { rows: 99441 }
    olist_customers_dataset.csv: { rows: 99441 }
    olist_order_items_dataset.csv: { rows: 112650 }
    olist_order_payments_dataset.csv: { rows: 103886 }
    olist_order_reviews_dataset.csv: { rows: 99224 }
    olist_products_dataset.csv: { rows: 32951 }
    olist_sellers_dataset.csv: { rows: 3095 }
    product_category_name_translation.csv: { rows: 73 }  # 71 on Kaggle; 73 on this mirror (verified)
    olist_geolocation_dataset.csv: { rows: 1000163 }  # shipped zipped on the mirror